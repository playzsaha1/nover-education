<script>
    // 1. Sidebar Toggle Logic
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
    }

    // 2. Hub Switching Logic
    // We now pass 'e' (the event) to ensure cross-browser compatibility
    function switchHub(hubType, e) {
      // Prevent error if event is missing
      const target = e ? e.currentTarget : null;
      
      // Update Active Button UI
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      if (target) target.classList.add('active');

      const studentHub = document.getElementById('studentHub');
      const frameWrapper = document.getElementById('hubFrameWrapper');
      const frame = document.getElementById('hubFrame');
      const title = document.getElementById('hubTitle');
      const subtitle = document.getElementById('hubSubtitle');

      // Auto-close sidebar on mobile after selection
      if (window.innerWidth < 900) {
        document.getElementById('sidebar').classList.add('collapsed');
      }

      if (hubType === 'student') {
        studentHub.classList.add('active');
        frameWrapper.classList.remove('active');
        title.innerText = "Student AI";
        subtitle.innerText = "General study help, summaries, flashcards, quizzes.";
      } else {
        studentHub.classList.remove('active');
        frameWrapper.classList.add('active');
        
        // Dynamic Title and Subtitle update
        const formattedTitle = hubType.charAt(0).toUpperCase() + hubType.slice(1);
        title.innerText = `${formattedTitle} Hub`;
        subtitle.innerText = `Specialised AI tools for ${hubType} reasoning and research.`;
        
        // Set the frame source
        frame.src = `hubs/${hubType}.html`; 
      }
    }

    // 3. Initialize: Attach listeners to all nav items properly
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const hub = item.getAttribute('data-hub');
        switchHub(hub, e);
      });
    });
  </script>
</body>
</html>
