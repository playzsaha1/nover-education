<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medical Hub</title>
  <style>
    :root {
      --accent-med: #dc2626; /* Medical Red */
      --text-main: #111827;
      --text-muted: #6b7280;
      --panel-border: #e5e7eb;
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 1.5rem; 
      background: #f5f7fb; 
      color: var(--text-main);
    }

    .panel { 
      background: #fff; 
      border-radius: 0.75rem; 
      padding: 1.5rem; 
      border: 1px solid var(--panel-border); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 { margin: 0 0 0.25rem 0; font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }

    textarea { 
      width: 100%; 
      min-height: 140px; 
      border-radius: 0.5rem; 
      border: 1px solid var(--panel-border); 
      padding: 0.8rem; 
      font-size: 0.95rem; 
      box-sizing: border-box;
      font-family: inherit;
      resize: vertical;
    }

    .btn-container { margin-top: 1rem; }

    button {
      background: var(--accent-med);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #fdf2f2; /* Light red tint for medical feel */
      border-radius: 0.5rem;
      border: 1px solid #fee2e2;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }

    .status { font-size: 0.85rem; color: var(--accent-med); margin-top: 1rem; display: none; font-style: italic; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>⚕️ Medical Reasoning & Mechanisms</h2>
    <p>Break down pathophysiology, differential diagnoses (DDx), and OSCE logic.</p>
    
    <textarea id="medInput" placeholder="e.g., 'A 45-year-old male presents with sudden onset pleuritic chest pain and dyspnea. Provide a list of differentials and the physiological mechanism of each...'"></textarea>
