<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medical Hub</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f9fafb; }
    .panel { background: #fff; border-radius: 0.75rem; padding: 1rem; border: 1px solid #e5e7eb; }
    h2 { margin-bottom: 0.25rem; }
    p { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.75rem; }
    textarea { width: 100%; min-height: 120px; border-radius: 0.5rem; border: 1px solid #e5e7eb; padding: 0.6rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Medical Hub</h2>
    <p>Use this space for mechanisms, differentials, OSCE‑style reasoning, and exam breakdowns.</p>
    <textarea placeholder="Describe a case, condition, or mechanism you want to reason through..."></textarea>
  </div>
</body>
</html>
