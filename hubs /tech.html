<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech & Coding Hub</title>
  <style>
    :root {
      --accent-tech: #6366f1; /* Indigo Tech */
      --text-main: #111827;
      --text-muted: #6b7280;
      --panel-border: #e5e7eb;
      --code-bg: #1e293b;
    }

    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 1.5rem; 
      background: #f5f7fb; 
      color: var(--text-main);
    }

    .panel { 
      background: #fff; 
      border-radius: 0.75rem; 
      padding: 1.5rem; 
      border: 1px solid var(--panel-border); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 { margin: 0 0 0.25rem 0; font-size: 1.25rem; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }

    textarea { 
      width: 100%; 
      min-height: 160px; 
      border-radius: 0.5rem; 
      border: 1px solid var(--panel-border); 
      padding: 0.8rem; 
      font-size: 0.9rem; 
      box-sizing: border-box;
      font-family: 'Fira Code', 'Consolas', monospace;
      background: #fafafa;
      resize: vertical;
    }

    .btn-container { margin-top: 1rem; }

    button {
      background: var(--accent-tech);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem; /* Blockier tech look */
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; }

    .output {
      margin-top: 1.5rem;
      padding: 1.2rem;
      background: var(--code-bg);
      color: #e2e8f0;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
      white-space: pre-wrap;
      font-family: 'Consolas', monospace;
      overflow-x: auto;
      border-left: 4px solid var(--accent-tech);
    }

    .loading { font-size: 0.85rem; color: var(--accent-tech); margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>💻 Architecture & Code Debugging</h2>
    <p>Debug logic, refactor functions, or design system architectures.</p>
    
    <textarea id="techInput" placeholder="Paste your code here or describe a system (e.g., 'How would I design a rate-limiter for a Node.js API?')"></textarea>
    
    <div class="btn-container">
      <button id="techBtn" onclick="runTechAI()">Execute Analysis</button>
    </div>

    <div id="loadMsg" class="loading">Compiling insights...</div>
    <div id="techOutput" class="output"></div>
  </div>

  <script>
    async function runTechAI() {
      const input = document.getElementById('techInput');
      const output = document.getElementById('techOutput');
      const btn = document.getElementById('techBtn');
      const loader = document.getElementById('loadMsg');

      if (!input.value.trim()) return;

      btn.disabled = true;
      loader.style.display = 'block';
      output.style.display = 'none';

      try {
        const techPrompt = "Act as a Senior Software Architect and Staff Engineer. " +
                           "Analyze the following code or tech query. Provide a concise explanation, " +
                           "identify potential bugs, and suggest optimized solutions with code blocks:\n\n" + 
                           input.value;
        
        const response = await window.parent.callAI(techPrompt);

        output.textContent = response;
        output.style.display = 'block';
      } catch (err) {
        output.textContent = "// Error: Stack overflow or connection lost.";
        output.style.display = 'block';
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
