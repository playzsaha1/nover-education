<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fitness & Sports Hub</title>
  <style>
    :root {
      --accent: #2563eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --panel-border: #e5e7eb;
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 1.5rem; 
      background: #f5f7fb; 
      color: var(--text-main);
    }

    .panel { 
      background: #fff; 
      border-radius: 0.75rem; 
      padding: 1.5rem; 
      border: 1px solid var(--panel-border); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 { margin: 0 0 0.25rem 0; font-size: 1.25rem; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }

    textarea { 
      width: 100%; 
      min-height: 120px; 
      border-radius: 0.5rem; 
      border: 1px solid var(--panel-border); 
      padding: 0.8rem; 
      font-size: 0.95rem; 
      box-sizing: border-box; /* Fixes overflow */
      font-family: inherit;
      resize: vertical;
    }

    .btn-container { margin-top: 1rem; }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 0.5rem;
      border: 1px solid var(--panel-border);
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap; /* Preserves workout formatting */
    }

    .status { font-size: 0.85rem; color: var(--accent); margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>🏃 Performance & Programming</h2>
    <p>Get AI-driven programming, exercise selection, and recovery strategies.</p>
    
    <textarea id="fitnessInput" placeholder="e.g., 'Design a 4-week hypertrophy block for a late-intermediate lifter focusing on overhead press...'"></textarea>
    
    <div class="btn-container">
      <button id="actionBtn" onclick="runCoachAI()">Analyze Performance</button>
    </div>

    <div id="statusMsg" class="status">Consulting performance data...</div>
    <div id="fitnessOutput" class="output"></div>
  </div>

  <script>
    async function runCoachAI() {
      const input = document.getElementById('fitnessInput');
      const output = document.getElementById('fitnessOutput');
      const btn = document.getElementById('actionBtn');
      const status = document.getElementById('statusMsg');

      if (!input.value.trim()) return;

      btn.disabled = true;
      status.style.display = 'block';
      output.style.display = 'none';

      try {
        // System Prompt: Gives the AI a specific personality/expertise
        const coachPrompt = "Act as a High-Performance Sports Coach and Biomechanist. " +
                            "Provide a detailed, science-based response to this query:\n\n" + 
                            input.value;
        
        // Calling the function from your main script.js
        const response = await window.parent.callAI(coachPrompt);

        output.textContent = response;
        output.style.display = 'block';
      } catch (err) {
        output.textContent = "Error: Connection to AI Coach failed.";
        output.style.display = 'block';
      } finally {
        btn.disabled = false;
        status.style.display = 'none';
      }
    }
  </script>
</body>
</html>
