<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Science Hub</title>
  <style>
    :root {
      --accent-sci: #0d9488; /* Science Teal */
      --text-main: #111827;
      --text-muted: #6b7280;
      --panel-border: #e5e7eb;
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 1.5rem; 
      background: #f5f7fb; 
      color: var(--text-main);
    }

    .panel { 
      background: #fff; 
      border-radius: 0.75rem; 
      padding: 1.5rem; 
      border: 1px solid var(--panel-border); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 { margin: 0 0 0.25rem 0; font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }

    textarea { 
      width: 100%; 
      min-height: 140px; 
      border-radius: 0.5rem; 
      border: 1px solid var(--panel-border); 
      padding: 0.8rem; 
      font-size: 0.95rem; 
      box-sizing: border-box;
      font-family: 'Consolas', 'Monaco', monospace; /* Monospace for scientific notation */
      resize: vertical;
    }

    .btn-container { margin-top: 1rem; }

    button {
      background: var(--accent-sci);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f0fdfa; 
      border-radius: 0.5rem;
      border: 1px solid #ccfbf1;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }

    .status { font-size: 0.85rem; color: var(--accent-sci); margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>🔬 Science & Research Hub</h2>
    <p>Unpack complex concepts, simulate experiments, and solve derivation problems.</p>
    
    <textarea id="sciInput" placeholder="e.g., 'Explain the Heisenberg Uncertainty Principle using a simple analogy' or 'Balance this redox reaction...'"></textarea>
    
    <div class="btn-container">
      <button id="sciBtn" onclick="runScienceAI()">Analyze Concept</button>
    </div>

    <div id="loadingStatus" class="status">Calculating variables and researching data...</div>
    <div id="sciOutput" class="output"></div>
  </div>

  <script>
    async function runScienceAI() {
      const input = document.getElementById('sciInput');
      const output = document.getElementById('sciOutput');
      const btn = document.getElementById('sciBtn');
      const status = document.getElementById('loadingStatus');

      if (!input.value.trim()) return;

      btn.disabled = true;
      status.style.display = 'block';
      output.style.display = 'none';

      try {
        const sciPrompt = "Act as an Expert Science Researcher and Professor. " +
                          "Break down the following query with high technical accuracy. " +
                          "Use step-by-step logic for derivations or complex processes. " +
                          "Where relevant, use standard scientific notation and formatting:\n\n" + 
                          input.value;
        
        const response = await window.parent.callAI(sciPrompt);

        output.textContent = response;
        output.style.display = 'block';
      } catch (err) {
        output.textContent = "Laboratory Error: Failed to synthesize response.";
        output.style.display = 'block';
      } finally {
        btn.disabled = false;
        status.style.display = 'none';
      }
    }
  </script>
</body>
</html>
